<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Voxel Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen">
        <div class="title-container">
            <h1 class="minecraft-title">WEB VOXEL</h1>
            <h2 class="minecraft-subtitle">Edition</h2>
        </div>
        <div class="menu-buttons">
            <button id="btn-singleplayer" class="mc-button">Singleplayer</button>
            <button id="btn-multiplayer" class="mc-button">Multiplayer</button>
        </div>
        <div class="menu-footer">Minecraft Clone - JS Edition</div>
    </div>

    <div id="crosshair" style="display: none;"></div>
    <div id="instructions" style="display: none;">
        Click to play<br/>
        <span style="font-size:16px">WASD to move, Space to jump, Click to mine, Right-click to place. <br/>Press 'E' for inventory. Press 'T' to chat.</span>
    </div>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Type a message or command (e.g. /gamemode 1)..." style="display: none;" autocomplete="off" />
    </div>

    <div id="hud-container" style="display: none;">
        <div id="status-bars">
            <div id="health-bar" class="status-bar">
                <!-- Hearts rendered via JS -->
            </div>
            <div id="hunger-bar" class="status-bar">
                <!-- Hunger shanks rendered via JS -->
            </div>
        </div>
        <div id="hotbar">
            <!-- Rendered via JS -->
        </div>
    </div>

    <div id="inventory">
        <h2 class="inv-title">Crafting</h2>
        <div id="crafting-area">
            <div id="crafting-grid">
                <div class="craft-slot" data-index="0"></div>
                <div class="craft-slot" data-index="1"></div>
                <div class="craft-slot" data-index="2"></div>
                <div class="craft-slot" data-index="3"></div>
                <div class="craft-slot" data-index="4"></div>
                <div class="craft-slot" data-index="5"></div>
                <div class="craft-slot" data-index="6"></div>
                <div class="craft-slot" data-index="7"></div>
                <div class="craft-slot" data-index="8"></div>
            </div>
            <div id="crafting-arrow"></div>
            <div id="crafting-result" class="craft-slot result-slot"></div>
        </div>
        <div class="inv-divider"></div>
        <h2 class="inv-title">Inventory</h2>
        <div id="inventory-items">
            <!-- Available block types to drag into hotbar/crafting -->
        </div>
    </div>

    <div id="furnace-ui" style="display: none;">
        <h2 class="inv-title">Furnace</h2>
        <div class="furnace-container">
            <div class="furnace-input-col">
                <div id="furnace-input" class="craft-slot" title="Input (Ore/Sand/Wood)"></div>
                <div id="furnace-flame" title="Click to Smelt">🔥</div>
                <div id="furnace-fuel" class="craft-slot" title="Fuel (Coal)"></div>
            </div>
            <div class="furnace-arrow">→</div>
            <div id="furnace-result" class="craft-slot result-slot" title="Result"></div>
        </div>
    </div>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Three.js and PointerLockControls from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="game.js"></script>
    <script type="module" src="ui.js"></script>
</body>
</html>
