<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Voxel Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen">
        <div class="title-container">
            <h1 class="minecraft-title">WEB VOXEL</h1>
            <h2 class="minecraft-subtitle">Edition</h2>
        </div>

        <div class="menu-buttons" id="main-menu-buttons">
            <button id="btn-singleplayer" class="mc-button">Singleplayer</button>
            <button id="btn-multiplayer" class="mc-button">Multiplayer</button>
            <button id="btn-options-main" class="mc-button">Options</button>
        </div>

        <div class="menu-buttons" id="options-menu-buttons" style="display: none; flex-direction: column; gap: 10px;">
            <div class="setting-row">
                <label for="slider-render">Render Distance</label>
                <input type="range" id="slider-render" min="16" max="128" step="16" value="64">
                <span id="val-render">64 Chunks</span>
            </div>
            <div class="setting-row">
                <label for="slider-fov">FOV</label>
                <input type="range" id="slider-fov" min="30" max="110" step="5" value="75">
                <span id="val-fov">75</span>
            </div>
            <div class="setting-row">
                <label for="slider-gui">GUI Scale</label>
                <input type="range" id="slider-gui" min="1" max="4" step="1" value="2">
                <span id="val-gui">Auto</span>
            </div>
            <div class="setting-row">
                <label for="slider-sens">Sensitivity</label>
                <input type="range" id="slider-sens" min="0.1" max="2.0" step="0.1" value="1.0">
                <span id="val-sens">1.0</span>
            </div>
            <div class="setting-row" style="justify-content: center; gap: 20px;">
                <button id="btn-toggle-shadows" class="mc-button" style="width: 180px;">Shadows: ON</button>
                <button id="btn-toggle-bloom" class="mc-button" style="width: 180px;">Bloom: ON</button>
            </div>
            <button id="btn-options-done" class="mc-button" style="margin-top: 15px;">Done</button>
        </div>

        <div class="menu-footer">Minecraft Clone - JS Edition</div>
    </div>

    <div id="crosshair" style="display: none;"></div>
    <div id="instructions" style="display: none;">
        Click to play<br/>
        <span style="font-size:16px">WASD to move, Space to jump, Click to mine, Right-click to place. <br/>Press 'E' for inventory. Press 'T' to chat.</span>
    </div>


    <div id="pause-screen" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; flex-direction: column;">
        <h1 class="minecraft-title" style="margin-bottom: 40px; font-size: 40px; text-shadow: 2px 2px 0px #000;">Game Menu</h1>
        <div class="menu-buttons" style="flex-direction: column; gap: 15px;">
            <button id="btn-resume" class="mc-button" style="width: 400px;">Back to Game</button>
            <button id="btn-options-pause" class="mc-button" style="width: 400px;">Options</button>
            <button id="btn-disconnect" class="mc-button" style="width: 400px;">Save and Quit to Title</button>
        </div>
    </div>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Type a message or command (e.g. /gamemode 1)..." style="display: none;" autocomplete="off" />
    </div>

    <div id="hud-container" style="display: none;">
        <div id="status-bars">
            <div id="health-bar" class="status-bar">
                <!-- Hearts rendered via JS -->
            </div>
            <div id="hunger-bar" class="status-bar">
                <!-- Hunger shanks rendered via JS -->
            </div>
        </div>
        <div id="hotbar">
            <!-- Rendered via JS -->
        </div>
    </div>

    <div id="inventory">
        <h2 class="inv-title">Crafting</h2>
        <div id="crafting-area">
            <div id="crafting-grid">
                <div class="craft-slot" data-index="0"></div>
                <div class="craft-slot" data-index="1"></div>
                <div class="craft-slot" data-index="2"></div>
                <div class="craft-slot" data-index="3"></div>
                <div class="craft-slot" data-index="4"></div>
                <div class="craft-slot" data-index="5"></div>
                <div class="craft-slot" data-index="6"></div>
                <div class="craft-slot" data-index="7"></div>
                <div class="craft-slot" data-index="8"></div>
            </div>
            <div id="crafting-arrow"></div>
            <div id="crafting-result" class="craft-slot result-slot"></div>
        </div>
        <div class="inv-divider"></div>
        <h2 class="inv-title">Inventory</h2>
        <div id="inventory-items">
            <!-- Available block types to drag into hotbar/crafting -->
        </div>
    </div>

    <div id="furnace-ui" style="display: none;">
        <h2 class="inv-title">Furnace</h2>
        <div class="furnace-container">
            <div class="furnace-input-col">
                <div id="furnace-input" class="craft-slot" title="Input (Ore/Sand/Wood)"></div>
                <div id="furnace-flame" title="Click to Smelt">🔥</div>
                <div id="furnace-fuel" class="craft-slot" title="Fuel (Coal)"></div>
            </div>
            <div class="furnace-arrow">→</div>
            <div id="furnace-result" class="craft-slot result-slot" title="Result"></div>
        </div>
    </div>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Three.js and PointerLockControls from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="game.js"></script>
    <script type="module" src="ui.js"></script>
</body>
</html>
